<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sneaker OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --ink:#16150f; --muted:#7a766c;
    --line:#e7e4dd; --line-2:#d9d5cc; --accent:#c8442a; --accent-soft:#f3e0da;
    --good:#3f7d54; --good-bg:#e7f0e8; --warn:#9a6b1f; --warn-bg:#f6ecd7;
    --slate:#5d6470; --slate-bg:#e9eaed; --rose:#9a4759; --rose-bg:#f3e3e6;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(20,18,12,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:14px; line-height:1.45;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 22px 80px}
  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:18px}
  .brand{display:flex; align-items:center; gap:11px}
  .mark{width:30px; height:30px; border-radius:9px; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:700; font-size:15px; letter-spacing:-.5px}
  .brand h1{font-size:20px; font-weight:700; letter-spacing:-.4px; margin:0}
  .brand .sub{font-size:12px; color:var(--muted); margin-top:1px}
  .actions{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  button,.btn{font-family:inherit; font-size:13px; font-weight:500; border-radius:9px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink); padding:8px 13px; cursor:pointer; transition:.15s; white-space:nowrap}
  button:hover,.btn:hover{border-color:#bdb8ad; background:#fff}
  button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
  button.primary:hover{background:#000}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  button.ghost:hover{color:var(--ink); background:rgba(0,0,0,.04)}
  button.danger{color:var(--accent); border-color:var(--accent-soft)}
  button.danger:hover{background:var(--accent-soft)}
  button:disabled{opacity:.5; cursor:not-allowed}

  .stats{display:flex; gap:26px; flex-wrap:wrap; padding:14px 2px 20px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .stat .n{font-size:21px; font-weight:700; letter-spacing:-.5px; font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:1px}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .search{flex:1; min-width:200px; position:relative}
  .search input{width:100%; border:1px solid var(--line-2); background:var(--panel); border-radius:10px; padding:9px 12px 9px 34px; font-size:13px; font-family:inherit}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted)}
  select.filter{border:1px solid var(--line-2); background:var(--panel); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; color:var(--ink)}

  .tablecard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:760px}
  thead th{position:sticky; top:0; background:#faf9f6; text-align:left; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; user-select:none}
  thead th.num{text-align:right}
  thead th .arr{opacity:.5; font-size:9px}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer; transition:.1s}
  tbody tr:hover{background:#faf8f4}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  td.name{font-weight:600; white-space:normal; min-width:190px}
  .idx{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px}
  .pill{display:inline-block; padding:2.5px 9px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.2px}
  .pill.roster{background:var(--good-bg); color:var(--good)}
  .pill.retired{background:var(--slate-bg); color:var(--slate)}
  .pill.out{background:var(--warn-bg); color:var(--warn)}
  .pill.sold{background:var(--rose-bg); color:var(--rose)}
  .pill.none{background:#eee; color:#999}
  .score{display:flex; align-items:center; gap:8px; justify-content:flex-end}
  .score .bar{width:46px; height:5px; border-radius:3px; background:var(--line); overflow:hidden}
  .score .bar i{display:block; height:100%; background:var(--accent)}
  .court{font-size:12px; color:var(--muted)}
  .empty{padding:48px; text-align:center; color:var(--muted)}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(22,21,15,.42); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel); border-radius:18px; box-shadow:var(--shadow); width:100%; max-width:720px; overflow:hidden}
  .modal.sm{max-width:380px}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0; font-size:16px; font-weight:700; letter-spacing:-.3px}
  .modal-body{padding:20px 22px; max-height:65vh; overflow:auto}
  .modal-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 22px; border-top:1px solid var(--line); background:#fbfaf7}
  .grp{margin-bottom:20px}
  .grp h3{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:0 0 10px; font-weight:600}
  .fields{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .fields.notes{grid-template-columns:1fr}
  .field{display:flex; flex-direction:column; gap:4px}
  .field.wide{grid-column:1/-1}
  .field label{font-size:11px; color:var(--muted); font-weight:500}
  .field input,.field textarea{font-family:inherit; font-size:13px; border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); width:100%}
  .field input:focus,.field textarea:focus{outline:none; border-color:var(--ink)}
  .field input:disabled,.field textarea:disabled{background:#f7f6f3; color:#3a382f; cursor:default}
  .field textarea{resize:vertical; min-height:64px; line-height:1.5}
  .login-row{display:flex; flex-direction:column; gap:11px}
  .note{font-size:12px; color:var(--muted); line-height:1.5}
  .err{color:var(--accent); font-size:12.5px; min-height:16px}

  /* toast */
  #toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:11px; font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; z-index:80; max-width:90vw}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--accent)}
  footer{margin-top:26px; text-align:center; color:var(--muted); font-size:12px}
  footer a{color:var(--muted)}
  @media(max-width:680px){ .fields{grid-template-columns:1fr 1fr} .stats{gap:18px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Sneaker OS</h1>
        <div class="sub" id="subtitle">basketball shoe roster</div>
      </div>
    </div>
    <div class="actions">
      <button id="addBtn" class="primary" style="display:none">+ Add sneaker</button>
      <button id="exportBtn" class="ghost">Export CSV</button>
      <button id="authBtn">Log in</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Search by name, review, match log…" />
    </div>
    <select class="filter" id="statusFilter"><option value="">All status</option></select>
    <select class="filter" id="courtFilter"><option value="">All courts</option></select>
  </div>

  <div class="tablecard">
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">No sneakers match.</div>
  </div>

  <footer>
    Stored in Supabase · public can view, only you can edit ·
    <a href="legacy.html">original demo</a>
  </footer>
</div>

<!-- Detail / edit modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detailTitle">Sneaker</h2>
      <button class="ghost" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="danger" id="deleteBtn" style="display:none">Delete</button>
      <div style="flex:1"></div>
      <button class="ghost" onclick="closeDetail()">Close</button>
      <button class="primary" id="saveBtn" style="display:none">Save</button>
    </div>
  </div>
</div>

<!-- Login modal -->
<div class="overlay" id="loginOverlay">
  <div class="modal sm">
    <div class="modal-head"><h2>Log in</h2><button class="ghost" onclick="closeLogin()">✕</button></div>
    <div class="modal-body">
      <div class="login-row">
        <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" /></div>
        <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" /></div>
        <div class="err" id="loginErr"></div>
        <div class="note">Only your account can edit the roster. Everyone else sees a read-only view.</div>
      </div>
    </div>
    <div class="modal-foot">
      <div style="flex:1"></div>
      <button class="ghost" onclick="closeLogin()">Cancel</button>
      <button class="primary" id="loginSubmit">Log in</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://rlawekkjrimefpapwyeu.supabase.co';
const SB_KEY = 'sb_publishable_anLXH2V7gSkuFXnqoDEk0Q_WStKxJ2T';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ---- field + column definitions -------------------------------------------
const GROUPS = [
  {h:'Identity', f:[['name','Name','text'],['status','Status','text'],['court_type','Court','text'],['size','Size','text'],['purchase_date','Purchase date','text'],['position','Order #','number']]},
  {h:'Usage', f:[['total_hours','Total hours','number'],['gym_hours','Gym h','number'],['indoor_hours','Indoor h','number'],['outdoor_hours','Outdoor h','number'],['games','Games','number'],['use_rate','Use rate %','number'],['lifespan_pct','Lifespan %','number'],['owned_days','Owned days','number']]},
  {h:'Ratings', f:[['performance_score','Performance','number'],['grip','Grip','number'],['fit_match','Fit match','number'],['startup_feedback','Startup feedback','number'],['low_cog','Low CoG','number'],['forefoot_cushion','Forefoot cushion','number'],['heel_cushion','Heel cushion','number'],['midsole_stability','Midsole stability','number'],['comfort','Comfort','number'],['foot_health','Foot health','number'],['weight_pct','Weight %','number'],['weight_g','Weight (g)','number']]},
  {h:'Value', f:[['price_bought','Price (£)','number'],['unit_price','Unit price (£)','number'],['cost_performance','Cost-perf','number'],['pref_difference','Pref Δ %','number'],['pref_before','Pref before','number'],['pref_after','Pref after','number']]},
  {h:'Notes', f:[['score_log','Match log','textarea'],['description','Description','textarea']]},
];
const ALLFIELDS = GROUPS.flatMap(g=>g.f);
const NUMERIC = new Set(ALLFIELDS.filter(f=>f[2]==='number').map(f=>f[0]));
const TABLE_COLS = [
  ['position','#','idx'],['name','Sneaker','text'],['status','Status','pill'],
  ['court_type','Court','court'],['performance_score','Perf','score'],
  ['total_hours','Hours','num'],['games','Games','num'],['use_rate','Use %','num'],
  ['price_bought','£','num'],['size','Size','text'],
];

let state = {rows:[], sortKey:'position', sortDir:1, user:null};

// ---- helpers --------------------------------------------------------------
const $ = id => document.getElementById(id);
function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.className='show'+(bad?' bad':''); setTimeout(()=>t.className='',2600); }
function pillClass(s){ if(!s) return 'none'; const l=s.toLowerCase(); if(l.includes('roster'))return'roster'; if(l.includes('retire'))return'retired'; if(l.includes('out'))return'out'; if(l.includes('sold')||l.includes('return'))return'sold'; return 'none'; }
function fmtNum(v){ if(v===null||v===undefined||v==='')return''; const n=Number(v); if(!isFinite(n))return''; return (Math.round(n*100)/100).toLocaleString(); }

// ---- auth -----------------------------------------------------------------
async function refreshUser(){
  const {data} = await sb.auth.getSession();
  state.user = data.session ? data.session.user : null;
  updateAuthUI();
}
function updateAuthUI(){
  const on = !!state.user;
  $('addBtn').style.display = on ? '' : 'none';
  $('authBtn').textContent = on ? 'Log out' : 'Log in';
  $('subtitle').textContent = on ? ('editing as ' + state.user.email) : 'basketball shoe roster';
}
$('authBtn').onclick = async ()=>{
  if(state.user){ await sb.auth.signOut(); await refreshUser(); toast('Logged out'); }
  else openLogin();
};
function openLogin(){ $('loginErr').textContent=''; $('loginOverlay').classList.add('show'); $('email').focus(); }
function closeLogin(){ $('loginOverlay').classList.remove('show'); }
$('loginSubmit').onclick = async ()=>{
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){ $('loginErr').textContent='Enter email and password.'; return; }
  $('loginSubmit').disabled=true; $('loginErr').textContent='';
  const {error} = await sb.auth.signInWithPassword({email,password});
  $('loginSubmit').disabled=false;
  if(error){ $('loginErr').textContent = error.message; return; }
  closeLogin(); $('password').value=''; await refreshUser(); toast('Welcome back'); render();
};
$('password').addEventListener('keydown',e=>{ if(e.key==='Enter') $('loginSubmit').click(); });

// ---- data -----------------------------------------------------------------
async function load(){
  const {data,error} = await sb.from('sneakers').select('*').order('position',{ascending:true});
  if(error){ toast('Load failed: '+error.message,true); return; }
  state.rows = data || [];
  buildFilters(); renderStats(); render();
}
function buildFilters(){
  const st=[...new Set(state.rows.map(r=>r.status).filter(Boolean))].sort();
  const ct=[...new Set(state.rows.map(r=>r.court_type).filter(Boolean))].sort();
  $('statusFilter').innerHTML='<option value="">All status</option>'+st.map(s=>`<option>${s}</option>`).join('');
  $('courtFilter').innerHTML='<option value="">All courts</option>'+ct.map(s=>`<option>${s}</option>`).join('');
}
function renderStats(){
  const r=state.rows;
  const hours=r.reduce((a,x)=>a+(Number(x.total_hours)||0),0);
  const spend=r.reduce((a,x)=>a+(Number(x.price_bought)||0),0);
  const games=r.reduce((a,x)=>a+(Number(x.games)||0),0);
  const active=r.filter(x=>(x.status||'').toLowerCase().includes('roster')).length;
  const cards=[['Pairs',r.length],['On roster',active],['Total hours',Math.round(hours).toLocaleString()],['Games',games],['Spent','£'+Math.round(spend).toLocaleString()]];
  $('stats').innerHTML=cards.map(c=>`<div class="stat"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
}

// ---- render table ---------------------------------------------------------
function render(){
  const q=$('search').value.trim().toLowerCase();
  const sf=$('statusFilter').value, cf=$('courtFilter').value;
  let rows=state.rows.filter(r=>{
    if(sf && r.status!==sf) return false;
    if(cf && r.court_type!==cf) return false;
    if(q){ const hay=[r.name,r.description,r.score_log,r.status,r.size].map(x=>(x||'').toLowerCase()).join(' '); if(!hay.includes(q)) return false; }
    return true;
  });
  const k=state.sortKey, d=state.sortDir;
  rows.sort((a,b)=>{
    let x=a[k], y=b[k];
    const xn=(x===null||x===undefined||x===''), yn=(y===null||y===undefined||y==='');
    if(xn&&yn)return 0; if(xn)return 1; if(yn)return -1;        // nulls last
    if(NUMERIC.has(k)||k==='position'){ x=Number(x); y=Number(y); }
    else { x=(''+x).toLowerCase(); y=(''+y).toLowerCase(); }
    return x<y?-1*d : x>y?1*d : 0;
  });

  $('head').innerHTML = TABLE_COLS.map(c=>{
    const isNum=['idx','num','score'].includes(c[2]);
    const arr = state.sortKey===c[0] ? `<span class="arr">${state.sortDir>0?'▲':'▼'}</span>` : '';
    return `<th class="${isNum?'num':''}" data-k="${c[0]}">${c[1]} ${arr}</th>`;
  }).join('');
  $('head').querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const key=th.dataset.k;
    if(state.sortKey===key) state.sortDir*=-1; else { state.sortKey=key; state.sortDir=1; }
    render();
  });

  const tb=$('rows'); tb.innerHTML='';
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.onclick=()=>openDetail(r);
    TABLE_COLS.forEach(c=>{
      const td=document.createElement('td'); const v=r[c[0]];
      if(c[2]==='pill'){ const p=document.createElement('span'); p.className='pill '+pillClass(v); p.textContent=v||'—'; td.appendChild(p); }
      else if(c[2]==='score'){ td.className='num';
        if(v===null||v===''||v===undefined){ td.textContent='—'; }
        else{ const pct=Math.max(0,Math.min(100,(Number(v)/10)*100));
          td.innerHTML=`<span class="score"><span>${fmtNum(v)}</span><span class="bar"><i style="width:${pct}%"></i></span></span>`; } }
      else if(c[2]==='num'){ td.className='num'; td.textContent=fmtNum(v); }
      else if(c[2]==='idx'){ td.className='num'; td.innerHTML=`<span class="idx">${v??''}</span>`; }
      else if(c[2]==='court'){ td.innerHTML=`<span class="court">${v||''}</span>`; }
      else if(c[0]==='name'){ td.className='name'; td.textContent=v||'(unnamed)'; }
      else { td.textContent=v??''; }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  $('empty').style.display = rows.length ? 'none' : 'block';
}
$('search').addEventListener('input',render);
$('statusFilter').addEventListener('change',render);
$('courtFilter').addEventListener('change',render);

// ---- detail / edit --------------------------------------------------------
let editing=null;
function openDetail(row){
  editing = row ? {...row} : {};
  const isNew = !row;
  const canEdit = !!state.user;
  $('detailTitle').textContent = isNew ? 'New sneaker' : (row.name||'Sneaker');
  const body=$('detailBody'); body.innerHTML='';
  GROUPS.forEach(g=>{
    const wrap=document.createElement('div'); wrap.className='grp';
    wrap.innerHTML=`<h3>${g.h}</h3>`;
    const grid=document.createElement('div'); grid.className='fields'+(g.h==='Notes'?' notes':'');
    g.f.forEach(([key,label,type])=>{
      const field=document.createElement('div'); field.className='field'+(type==='textarea'?' wide':'');
      const val = editing[key]===null||editing[key]===undefined ? '' : editing[key];
      const dis = canEdit ? '' : 'disabled';
      const input = type==='textarea'
        ? `<textarea id="f_${key}" ${dis}>${(''+val).replace(/</g,'&lt;')}</textarea>`
        : `<input id="f_${key}" type="${type==='number'?'number':'text'}" step="any" value="${(''+val).replace(/"/g,'&quot;')}" ${dis} />`;
      field.innerHTML=`<label>${label}</label>${input}`;
      grid.appendChild(field);
    });
    wrap.appendChild(grid); body.appendChild(wrap);
  });
  $('saveBtn').style.display = canEdit ? '' : 'none';
  $('deleteBtn').style.display = (canEdit && !isNew) ? '' : 'none';
  $('detailOverlay').classList.add('show');
}
function closeDetail(){ $('detailOverlay').classList.remove('show'); editing=null; }
function gather(){
  const obj={};
  ALLFIELDS.forEach(([key,,type])=>{
    let v=$('f_'+key).value;
    if(type==='number'){ v=v.trim()===''?null:Number(v); if(v!==null&&!isFinite(v))v=null; }
    else { v=v.trim()===''?null:v; }
    obj[key]=v;
  });
  return obj;
}
$('saveBtn').onclick = async ()=>{
  if(!state.user){ toast('Log in first',true); return; }
  const payload=gather();
  if(!payload.name){ toast('Name is required',true); return; }
  $('saveBtn').disabled=true;
  let res;
  if(editing && editing.id){ res=await sb.from('sneakers').update(payload).eq('id',editing.id).select(); }
  else { res=await sb.from('sneakers').insert(payload).select(); }
  $('saveBtn').disabled=false;
  if(res.error){ toast('Save failed: '+res.error.message,true); return; }
  closeDetail(); await load(); toast('Saved');
};
$('deleteBtn').onclick = async ()=>{
  if(!editing||!editing.id) return;
  if(!confirm('Delete "'+(editing.name||'this sneaker')+'"? This cannot be undone.')) return;
  const {error}=await sb.from('sneakers').delete().eq('id',editing.id);
  if(error){ toast('Delete failed: '+error.message,true); return; }
  closeDetail(); await load(); toast('Deleted');
};
$('addBtn').onclick = ()=>{
  const maxPos=state.rows.reduce((m,r)=>Math.max(m,Number(r.position)||0),0);
  openDetail(null);
  if($('f_position')) $('f_position').value = maxPos+1;
};

// ---- CSV export -----------------------------------------------------------
$('exportBtn').onclick = ()=>{
  const cols=['position',...ALLFIELDS.map(f=>f[0]).filter(k=>k!=='position')];
  const esc=v=>{ if(v===null||v===undefined)return''; const s=''+v; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[cols.join(',')];
  state.rows.slice().sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0))
    .forEach(r=>lines.push(cols.map(c=>esc(r[c])).join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='sneaker-os-export.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exported');
};

// close overlays on backdrop click / Esc
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show')); });

// ---- boot -----------------------------------------------------------------
sb.auth.onAuthStateChange(()=>refreshUser());
(async()=>{ await refreshUser(); await load(); })();
</script>
</body>
</html>
